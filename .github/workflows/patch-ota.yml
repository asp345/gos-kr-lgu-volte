name: Patch OTA

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: GrapheneOS build number (empty for the latest build in CHANNEL)
        required: false

permissions:
  contents: write

concurrency:
  group: patch-ota

env:
  DEVICE: shiba
  CHANNEL: alpha-security-preview
  EXPECTED_AVB_KEY_SHA256: cd7479653aa88208f9f03034810ef9b7b0af8a9d41e2000e458ac403a2acb233
  AVBROOT_VERSION: 3.37.1
  AVBROOT_SHA256: d000788f403f2e51df81de5e0e7130559fd68b66e8832e60e344e31d123e69d6
  AFSR_VERSION: 2.0.0
  AFSR_SHA256: 6a97cbd618cb65c58fedb1cc4ad40d5957cb0e8e2d8c1cf5372ce9b80d4826af

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version="$(curl -fsS "https://releases.grapheneos.org/$DEVICE-$CHANNEL" | cut -d' ' -f1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  patch:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-24.04-arm
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/chenxiaolong/avbroot/releases/download/v$AVBROOT_VERSION/avbroot-$AVBROOT_VERSION-aarch64-unknown-linux-gnu.zip"
          curl -fsSLO "https://github.com/chenxiaolong/afsr/releases/download/v$AFSR_VERSION/afsr-$AFSR_VERSION-aarch64-unknown-linux-gnu.zip"
          echo "$AVBROOT_SHA256  avbroot-$AVBROOT_VERSION-aarch64-unknown-linux-gnu.zip" | sha256sum -c -
          echo "$AFSR_SHA256  afsr-$AFSR_VERSION-aarch64-unknown-linux-gnu.zip" | sha256sum -c -
          unzip -o "avbroot-$AVBROOT_VERSION-aarch64-unknown-linux-gnu.zip" avbroot -d bin
          unzip -o "afsr-$AFSR_VERSION-aarch64-unknown-linux-gnu.zip" afsr -d bin
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Download OTA
        run: curl -fsSLo "$RUNNER_TEMP/input.zip" "https://releases.grapheneos.org/$DEVICE-ota_update-$VERSION.zip"

      - name: Write keys
        env:
          AVB_KEY: ${{ secrets.AVB_KEY }}
          OTA_KEY: ${{ secrets.OTA_KEY }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/keys"
          printf '%s\n' "$AVB_KEY" > "$RUNNER_TEMP/keys/avb.key"
          printf '%s\n' "$OTA_KEY" > "$RUNNER_TEMP/keys/ota.key"

      - name: Patch
        env:
          KEY_AVB: ${{ runner.temp }}/keys/avb.key
          KEY_OTA: ${{ runner.temp }}/keys/ota.key
          PASSPHRASE_AVB: ${{ secrets.AVB_PASSPHRASE }}
          PASSPHRASE_OTA: ${{ secrets.OTA_PASSPHRASE }}
        run: |
          scripts/patch-ota.sh "$RUNNER_TEMP/input.zip" "$RUNNER_TEMP/$DEVICE-ota_update-$VERSION.zip" "$RUNNER_TEMP/work"
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/input.zip"

      - uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/${{ env.DEVICE }}-ota_update-${{ env.VERSION }}.zip

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" "$RUNNER_TEMP/$DEVICE-ota_update-$VERSION.zip" \
            --title "$DEVICE $VERSION" \
            --notes "GrapheneOS $VERSION for $DEVICE with the LG U+ VoLTE patch, without Updater, re-signed with custom AVB and OTA keys.

          Verify provenance: \`gh attestation verify $DEVICE-ota_update-$VERSION.zip -R $GITHUB_REPOSITORY\`"
